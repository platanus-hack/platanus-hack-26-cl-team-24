[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mosaic-guard"
version = "0.1.0"
description = "Evaluación de divulgaciones acumulativas por destinatario"
requires-python = ">=3.11"
dependencies = ["rdflib>=7.6,<8", "owlrl>=7.6,<8", "problog>=2.2,<3", "PyYAML>=6,<7", "pydantic>=2.10,<3"]

[project.optional-dependencies]
claude = ["anthropic>=0.75,<3", "keyring>=25,<26"]
api = ["langgraph>=1.0,<2", "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "httpx>=0.27,<1", "anthropic>=0.75,<3", "keyring>=25,<26"]

[project.scripts]
isde = "isde.cli:main"
mosaic = "isde.cli:main"

[tool.setuptools]
# Ship the example YAMLs inside the package so `isde demo` works from any directory after a plain install.
packages = ["isde", "isde.examples"]
package-dir = {"isde.examples" = "examples"}
package-data = {"isde" = ["fonts/*", "logo.png"], "isde.examples" = ["*.yaml"]}
